<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Воронка продаж — интеграция с CRM</title>
<style>
  :root{--bg:#eef1f6;--rail:#1f2b3a;--card:#fff;--line:#e2e6ee;--txt:#26313f;--dim:#7a8699;
    --blue:#2f8de4;--orange:#f2994a;--violet:#8b5cf6;--green:#27ae60;--red:#eb5757;--teal:#12b3a6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 "Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  .app{display:grid;grid-template-columns:60px 1fr;height:100vh}
  @media(max-width:700px){.app{grid-template-columns:48px 1fr}}

  /* левый рейл, как в amoCRM/Битрикс */
  .rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
  .rail .lg{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2f8de4,#12b3a6);margin-bottom:14px}
  .rail a{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#8ea0b6;font-size:18px;text-decoration:none}
  .rail a.on{background:rgba(255,255,255,.12);color:#fff}
  .rail a:hover{color:#fff}

  .main{display:flex;flex-direction:column;overflow:hidden}
  .bar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
  .bar h1{font-size:17px;margin:0;font-weight:700}
  .bar .tabs{display:flex;gap:4px;margin-left:8px}
  .bar .tabs span{font-size:13px;color:var(--dim);padding:5px 11px;border-radius:6px;cursor:pointer}
  .bar .tabs span.on{background:#eef4fb;color:var(--blue);font-weight:600}
  .bar .add{margin-left:auto;background:var(--blue);color:#fff;border:none;border-radius:7px;padding:8px 15px;font-weight:600;font-size:13px;cursor:pointer}
  .bar .search{border:1px solid var(--line);border-radius:7px;padding:7px 12px;font-size:13px;color:var(--dim);background:#f6f8fb;min-width:180px}

  /* воронка */
  .pipe{flex:1;display:flex;gap:12px;padding:16px 20px;overflow-x:auto;align-items:flex-start}
  .col{flex:0 0 244px;display:flex;flex-direction:column;max-height:100%}
  .col .head{border-radius:8px 8px 0 0;padding:9px 12px;color:#fff}
  .col .head .st{font-weight:700;font-size:13px;display:flex;justify-content:space-between}
  .col .head .sum{font-size:12px;opacity:.9;margin-top:2px}
  .col .body{background:rgba(255,255,255,.5);border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
  .deal{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px;box-shadow:0 1px 2px rgba(20,30,50,.05);cursor:pointer;transition:.12s}
  .deal:hover{box-shadow:0 6px 16px -6px rgba(20,30,50,.22);transform:translateY(-1px)}
  .deal .co{font-weight:600;font-size:13.5px}
  .deal .price{font-weight:700;font-size:15px;margin:5px 0 7px}
  .deal .row{display:flex;align-items:center;gap:7px}
  .deal .src{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
  .s-site{background:#eaf4fd;color:var(--blue)} .s-bot{background:#eefaf5;color:var(--green)}
  .s-call{background:#fdf0e6;color:var(--orange)} .s-wa{background:#eefaf3;color:var(--teal)}
  .deal .ava{margin-left:auto;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
  .deal .days{font-size:11px;color:var(--dim);margin-top:6px}
  .note{padding:8px 20px;background:#fff;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px;display:flex;gap:8px;align-items:center}
  .note b{color:var(--txt)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
  .deal:active{transform:scale(.98)}
  .tabs span,.add,.rail a,.deal{user-select:none}
  /* панель сделки */
  .ov{position:fixed;inset:0;background:rgba(20,30,50,.35);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .ov.on{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;right:0;width:400px;max-width:92vw;height:100%;background:#fff;z-index:50;
    box-shadow:-16px 0 44px -20px rgba(20,30,50,.4);transform:translateX(100%);transition:transform .24s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column}
  .panel.on{transform:none}
  .ph{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
  .ph .x{margin-left:auto;background:none;border:none;font-size:22px;color:var(--dim);cursor:pointer;line-height:1}
  .ph h2{margin:0;font-size:19px}
  .ph .price{font-size:22px;font-weight:800;margin-top:4px}
  .pstage{display:inline-block;color:#fff;font-size:12px;font-weight:600;padding:3px 11px;border-radius:20px;margin-top:8px}
  .pbody{padding:18px 20px;overflow-y:auto;flex:1}
  .field{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .field .k{color:var(--dim)}
  .field .v{font-weight:600}
  .pacts{display:flex;gap:8px;margin:16px 0}
  .pacts button{flex:1;border:none;border-radius:8px;padding:11px;font-weight:600;font-size:13px;cursor:pointer}
  .pacts .call{background:var(--blue);color:#fff}
  .pacts .msg{background:#eef4fb;color:var(--blue)}
  .feed h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:18px 0 10px}
  .ev{display:flex;gap:10px;margin-bottom:12px;font-size:13px}
  .ev .t{color:var(--dim);flex:none;width:52px}
  .ev .d b{color:var(--txt)}
</style>
</head>
<body>
<div class="app">
  <div class="rail">
    <div class="lg"></div>
    <a class="on" title="Сделки">▦</a>
    <a title="Задачи">✓</a>
    <a title="Списки">☰</a>
    <a title="Почта">✉</a>
    <a title="Аналитика">▤</a>
    <a title="Настройки">⚙</a>
  </div>
  <div class="main">
    <div class="bar">
      <h1>Воронка продаж</h1>
      <div class="tabs"><span class="on">Канбан</span><span>Список</span><span>Аналитика</span></div>
      <input class="search" placeholder="Поиск сделки, компании...">
      <button class="add">+ Сделка</button>
    </div>
    <div class="pipe" id="pipe"></div>
    <div class="note"><span class="dot"></span><b>Синхронизация с сайтом, телефонией и 1С активна.</b> Заявки со всех каналов падают сюда автоматически. Демо, данные вымышлены.</div>
  </div>
</div>

<div class="ov" id="ov"></div>
<aside class="panel" id="panel">
  <div class="ph">
    <div>
      <h2 id="p-co">—</h2>
      <div class="price num" id="p-price">—</div>
      <span class="pstage" id="p-stage">—</span>
    </div>
    <button class="x" id="p-close">×</button>
  </div>
  <div class="pbody">
    <div class="field"><span class="k">Источник</span><span class="v" id="p-src">—</span></div>
    <div class="field"><span class="k">Ответственный</span><span class="v" id="p-resp">—</span></div>
    <div class="field"><span class="k">Телефон</span><span class="v" id="p-phone">—</span></div>
    <div class="field"><span class="k">В этапе</span><span class="v" id="p-days">—</span></div>
    <div class="field"><span class="k">Бюджет</span><span class="v num" id="p-budget">—</span></div>
    <div class="pacts">
      <button class="call">Позвонить</button>
      <button class="msg">Написать</button>
    </div>
    <div class="feed">
      <h4>История</h4>
      <div id="p-feed"></div>
    </div>
  </div>
</aside>

<script>
  var STAGES=[
    ['Первичный контакт','#2f8de4',[
      ['ООО СтройБаза','92 000','s-bot','Telegram-бот','И','#2f8de4','2 часа'],
      ['Автотрейд Юг','48 500','s-site','Сайт','П','#8b5cf6','сегодня'],
      ['ИП Морозов','17 200','s-call','Звонок','И','#2f8de4','1 день']]],
    ['Переговоры','#f2994a',[
      ['Дом-Строй','128 000','s-site','Сайт','П','#8b5cf6','2 дня'],
      ['СервисМонтаж','54 000','s-wa','WhatsApp','А','#27ae60','1 день']]],
    ['Согласование КП','#8b5cf6',[
      ['РемонтПро','76 400','s-bot','Telegram-бот','И','#2f8de4','3 дня'],
      ['Кофейня «Зерно»','31 000','s-site','Сайт','А','#27ae60','сегодня']]],
    ['Счёт на оплату','#12b3a6',[
      ['Гранд Отель','210 000','s-call','Звонок','П','#8b5cf6','1 день']]],
    ['Успешно реализовано','#27ae60',[
      ['Барбершоп «Бор»','38 900','s-bot','Telegram-бот','А','#27ae60','вчера'],
      ['ООО Логист','64 500','s-site','Сайт','И','#2f8de4','2 дня']]]
  ];
  var RESP={'И':'Илья Р.','П':'Пётр С.','А':'Анна К.'};
  var PHONE=['+7 918 340‑12‑07','+7 988 512‑44‑90','+7 862 271‑03‑88','+7 928 419‑77‑15','+7 900 602‑18‑34'];
  function rub(s){return String(s).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₽';}
  function feed(d){
    return '<div class="ev"><span class="t">'+d[6]+'</span><div class="d">этап <b>'+d._stage+'</b></div></div>'+
      '<div class="ev"><span class="t">'+d[6]+'</span><div class="d"><b>'+RESP[d[4]]+'</b> взял в работу</div></div>'+
      '<div class="ev"><span class="t">'+d[6]+'</span><div class="d">заявка с <b>'+d[3]+'</b> → создана автоматически</div></div>';
  }
  window.openDeal=function(d){
    document.getElementById('p-co').textContent=d[0];
    document.getElementById('p-price').textContent=rub(d[1]);
    var ps=document.getElementById('p-stage');ps.textContent=d._stage;ps.style.background=d._color;
    document.getElementById('p-src').textContent=d[3];
    document.getElementById('p-resp').textContent=RESP[d[4]]||d[4];
    document.getElementById('p-phone').textContent=d._phone;
    document.getElementById('p-days').textContent=d[6];
    document.getElementById('p-budget').textContent=rub(d[1]);
    document.getElementById('p-feed').innerHTML=feed(d);
    document.getElementById('panel').classList.add('on');
    document.getElementById('ov').classList.add('on');
  };
  function closeDeal(){document.getElementById('panel').classList.remove('on');document.getElementById('ov').classList.remove('on');}
  document.getElementById('p-close').onclick=closeDeal;
  document.getElementById('ov').onclick=closeDeal;
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDeal();});

  var pi=0;
  document.getElementById('pipe').innerHTML=STAGES.map(function(st){
    var deals=st[2];
    var total=deals.reduce(function(a,d){return a+(+d[1].replace(/\s/g,''));},0);
    var cards=deals.map(function(d){
      d._stage=st[0];d._color=st[1];d._phone=PHONE[pi%PHONE.length];pi++;
      var key=STAGES.indexOf(st)+'_'+deals.indexOf(d);
      return '<div class="deal" data-k="'+key+'"><div class="co">'+d[0]+'</div>'+
        '<div class="price num">'+rub(d[1])+'</div>'+
        '<div class="row"><span class="src '+d[2]+'">'+d[3]+'</span>'+
        '<span class="ava" style="background:'+d[5]+'">'+d[4]+'</span></div>'+
        '<div class="days">в этапе '+d[6]+'</div></div>';
    }).join('');
    return '<div class="col"><div class="head" style="background:'+st[1]+'">'+
      '<div class="st"><span>'+st[0]+'</span><span>'+deals.length+'</span></div>'+
      '<div class="sum num">'+rub(String(total))+'</div></div>'+
      '<div class="body">'+cards+'</div></div>';
  }).join('');

  // клик по карточке → открыть сделку
  document.getElementById('pipe').addEventListener('click',function(e){
    var el=e.target.closest('.deal');if(!el)return;
    var k=el.getAttribute('data-k').split('_');
    openDeal(STAGES[+k[0]][2][+k[1]]);
  });
  // вкладки
  var tabs=document.querySelectorAll('.tabs span');
  tabs.forEach(function(t){t.onclick=function(){tabs.forEach(function(x){x.classList.remove('on');});t.classList.add('on');};});
  // рейл
  var links=document.querySelectorAll('.rail a');
  links.forEach(function(a){a.onclick=function(){links.forEach(function(x){x.classList.remove('on');});a.classList.add('on');};});
  // + Сделка / кнопки в панели — гасим переход, это демо
  document.querySelector('.add').onclick=function(){alert('Форма новой сделки — в демо отключена.');};
  document.querySelectorAll('.pacts button').forEach(function(b){b.onclick=function(){alert('Действие доступно в рабочей версии CRM.');};});
</script>
</body>
</html>
