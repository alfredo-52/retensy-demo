<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Воронка продаж — интеграция с CRM</title>
<style>
  :root{--bg:#eef1f6;--rail:#1f2b3a;--card:#fff;--line:#e2e6ee;--txt:#26313f;--dim:#7a8699;
    --blue:#2f8de4;--orange:#f2994a;--violet:#8b5cf6;--green:#27ae60;--red:#eb5757;--teal:#12b3a6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 "Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  .app{display:grid;grid-template-columns:60px 1fr;height:100vh}
  @media(max-width:700px){.app{grid-template-columns:48px 1fr}}

  /* левый рейл, как в amoCRM/Битрикс */
  .rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
  .rail .lg{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2f8de4,#12b3a6);margin-bottom:14px}
  .rail a{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#8ea0b6;font-size:18px;text-decoration:none}
  .rail a.on{background:rgba(255,255,255,.12);color:#fff}
  .rail a:hover{color:#fff}

  .main{display:flex;flex-direction:column;overflow:hidden}
  .bar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
  .bar h1{font-size:17px;margin:0;font-weight:700}
  .bar .tabs{display:flex;gap:4px;margin-left:8px}
  .bar .tabs span{font-size:13px;color:var(--dim);padding:5px 11px;border-radius:6px;cursor:pointer}
  .bar .tabs span.on{background:#eef4fb;color:var(--blue);font-weight:600}
  .bar .add{margin-left:auto;background:var(--blue);color:#fff;border:none;border-radius:7px;padding:8px 15px;font-weight:600;font-size:13px;cursor:pointer}
  .bar .search{border:1px solid var(--line);border-radius:7px;padding:7px 12px;font-size:13px;color:var(--dim);background:#f6f8fb;min-width:180px}

  /* воронка */
  .pipe{flex:1;display:flex;gap:12px;padding:16px 20px;overflow-x:auto;align-items:flex-start}
  .col{flex:0 0 244px;display:flex;flex-direction:column;max-height:100%}
  .col .head{border-radius:8px 8px 0 0;padding:9px 12px;color:#fff}
  .col .head .st{font-weight:700;font-size:13px;display:flex;justify-content:space-between}
  .col .head .sum{font-size:12px;opacity:.9;margin-top:2px}
  .col .body{background:rgba(255,255,255,.5);border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
  .deal{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px;box-shadow:0 1px 2px rgba(20,30,50,.05);cursor:pointer;transition:.12s}
  .deal:hover{box-shadow:0 6px 16px -6px rgba(20,30,50,.22);transform:translateY(-1px)}
  .deal .co{font-weight:600;font-size:13.5px}
  .deal .price{font-weight:700;font-size:15px;margin:5px 0 7px}
  .deal .row{display:flex;align-items:center;gap:7px}
  .deal .src{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
  .s-site{background:#eaf4fd;color:var(--blue)} .s-bot{background:#eefaf5;color:var(--green)}
  .s-call{background:#fdf0e6;color:var(--orange)} .s-wa{background:#eefaf3;color:var(--teal)}
  .deal .ava{margin-left:auto;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
  .deal .days{font-size:11px;color:var(--dim);margin-top:6px}
  .note{padding:8px 20px;background:#fff;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px;display:flex;gap:8px;align-items:center}
  .note b{color:var(--txt)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
  .deal:active{transform:scale(.98)}
  .tabs span,.add,.rail a,.deal{user-select:none}
  /* панель сделки */
  .ov{position:fixed;inset:0;background:rgba(20,30,50,.35);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .ov.on{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;right:0;width:400px;max-width:92vw;height:100%;background:#fff;z-index:50;
    box-shadow:-16px 0 44px -20px rgba(20,30,50,.4);transform:translateX(100%);transition:transform .24s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column}
  .panel.on{transform:none}
  .ph{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
  .ph .x{margin-left:auto;background:none;border:none;font-size:22px;color:var(--dim);cursor:pointer;line-height:1}
  .ph h2{margin:0;font-size:19px}
  .ph .price{font-size:22px;font-weight:800;margin-top:4px}
  .pstage{display:inline-block;color:#fff;font-size:12px;font-weight:600;padding:3px 11px;border-radius:20px;margin-top:8px}
  .pbody{padding:18px 20px;overflow-y:auto;flex:1}
  .field{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .field .k{color:var(--dim)}
  .field .v{font-weight:600}
  .pacts{display:flex;gap:8px;margin:16px 0}
  .pacts button{flex:1;border:none;border-radius:8px;padding:11px;font-weight:600;font-size:13px;cursor:pointer}
  .pacts .call{background:var(--blue);color:#fff}
  .pacts .msg{background:#eef4fb;color:var(--blue)}
  .feed h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:18px 0 10px}
  .ev{display:flex;gap:10px;margin-bottom:12px;font-size:13px}
  .ev .t{color:var(--dim);flex:none;width:52px}
  .ev .d b{color:var(--txt)}
  [hidden]{display:none!important}
  /* Список */
  .listview{flex:1;overflow:auto;background:#fff}
  .ltable{width:100%;border-collapse:collapse;font-size:13px}
  .ltable th{position:sticky;top:0;background:#f4f6fa;text-align:left;font-weight:600;color:#55607a;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
  .ltable th.r,.ltable td.r{text-align:right}
  .ltable td{padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
  .ltable tbody tr{cursor:pointer}
  .ltable tbody tr:hover{background:#f6f9fd}
  .ltable .co{font-weight:600}
  .ltable .stg{display:inline-flex;align-items:center;gap:7px}
  .ltable .stg::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--_c,#ccc)}
  .lava{width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;vertical-align:middle;margin-right:6px}
  /* Аналитика */
  .anaview{flex:1;overflow:auto;padding:20px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 18px}
  .kpi .kv{font-size:23px;font-weight:800}
  .kpi .kk{color:var(--dim);font-size:12px;margin-top:4px}
  .acard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}
  .acard h3{font-size:14px;margin:0 0 16px;font-weight:700}
  .abar{display:flex;align-items:center;gap:12px;margin-bottom:13px;font-size:13px}
  .abar .lab{width:160px;flex:none;color:var(--txt)}
  .abar .track{flex:1;height:22px;background:#eef1f6;border-radius:5px;overflow:hidden}
  .abar .track{display:block}
  .abar .fill{display:block;height:100%;border-radius:5px;min-width:3px}
  .abar .val{width:100px;text-align:right;flex:none;font-weight:600}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="rail">
    <div class="lg"></div>
    <a class="on" title="Сделки">▦</a>
    <a title="Задачи">✓</a>
    <a title="Списки">☰</a>
    <a title="Почта">✉</a>
    <a title="Аналитика">▤</a>
    <a title="Настройки">⚙</a>
  </div>
  <div class="main">
    <div class="bar">
      <h1>Воронка продаж</h1>
      <div class="tabs"><span class="on">Канбан</span><span>Список</span><span>Аналитика</span></div>
      <input class="search" placeholder="Поиск сделки, компании...">
      <button class="add">+ Сделка</button>
    </div>
    <div class="pipe" id="pipe"></div>
    <div class="listview" id="list" hidden></div>
    <div class="anaview" id="ana" hidden></div>
    <div class="note"><span class="dot"></span><b>Синхронизация с сайтом, телефонией и 1С активна.</b> Заявки со всех каналов падают сюда автоматически. Демо, данные вымышлены.</div>
  </div>
</div>

<div class="ov" id="ov"></div>
<aside class="panel" id="panel">
  <div class="ph">
    <div>
      <h2 id="p-co">—</h2>
      <div class="price num" id="p-price">—</div>
      <span class="pstage" id="p-stage">—</span>
    </div>
    <button class="x" id="p-close">×</button>
  </div>
  <div class="pbody">
    <div class="field"><span class="k">Источник</span><span class="v" id="p-src">—</span></div>
    <div class="field"><span class="k">Ответственный</span><span class="v" id="p-resp">—</span></div>
    <div class="field"><span class="k">Телефон</span><span class="v" id="p-phone">—</span></div>
    <div class="field"><span class="k">В этапе</span><span class="v" id="p-days">—</span></div>
    <div class="field"><span class="k">Бюджет</span><span class="v num" id="p-budget">—</span></div>
    <div class="pacts">
      <button class="call">Позвонить</button>
      <button class="msg">Написать</button>
    </div>
    <div class="feed">
      <h4>История</h4>
      <div id="p-feed"></div>
    </div>
  </div>
</aside>

<script>
  var STAGES=[
    ['Первичный контакт','#2f8de4',[
      ['ООО СтройБаза','92 000','s-bot','Telegram-бот','И','#2f8de4','2 часа'],
      ['Автотрейд Юг','48 500','s-site','Сайт','П','#8b5cf6','сегодня'],
      ['ИП Морозов','17 200','s-call','Звонок','И','#2f8de4','1 день']]],
    ['Переговоры','#f2994a',[
      ['Дом-Строй','128 000','s-site','Сайт','П','#8b5cf6','2 дня'],
      ['СервисМонтаж','54 000','s-wa','WhatsApp','А','#27ae60','1 день']]],
    ['Согласование КП','#8b5cf6',[
      ['РемонтПро','76 400','s-bot','Telegram-бот','И','#2f8de4','3 дня'],
      ['Кофейня «Зерно»','31 000','s-site','Сайт','А','#27ae60','сегодня']]],
    ['Счёт на оплату','#12b3a6',[
      ['Гранд Отель','210 000','s-call','Звонок','П','#8b5cf6','1 день']]],
    ['Успешно реализовано','#27ae60',[
      ['Барбершоп «Бор»','38 900','s-bot','Telegram-бот','А','#27ae60','вчера'],
      ['ООО Логист','64 500','s-site','Сайт','И','#2f8de4','2 дня']]]
  ];
  var RESP={'И':'Илья Р.','П':'Пётр С.','А':'Анна К.'};
  var PHONE=['+7 918 340‑12‑07','+7 988 512‑44‑90','+7 862 271‑03‑88','+7 928 419‑77‑15','+7 900 602‑18‑34'];
  var SRCLABEL={'s-site':'Сайт','s-bot':'Telegram-бот','s-call':'Звонок','s-wa':'WhatsApp'};
  var SRCC={'s-site':'#2f8de4','s-bot':'#27ae60','s-call':'#f2994a','s-wa':'#12b3a6'};
  function rub(s){return String(s).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₽';}
  function n(v){return +String(v).replace(/\s/g,'');}

  // плоский список сделок с ключами
  var DEALS=[];
  STAGES.forEach(function(st,si){
    st[2].forEach(function(d){
      DEALS.push({name:d[0],sum:n(d[1]),src:d[2],srcN:d[3],ava:d[4],avaC:d[5],days:d[6],
        stage:st[0],color:st[1],phone:PHONE[DEALS.length%PHONE.length],si:si});
    });
  });

  function feed(d){
    return '<div class="ev"><span class="t">'+d.days+'</span><div class="d">этап <b>'+d.stage+'</b></div></div>'+
      '<div class="ev"><span class="t">'+d.days+'</span><div class="d"><b>'+(RESP[d.ava]||'—')+'</b> взял в работу</div></div>'+
      '<div class="ev"><span class="t">'+d.days+'</span><div class="d">заявка с <b>'+d.srcN+'</b> создана автоматически</div></div>';
  }
  window.openDeal=function(d){
    document.getElementById('p-co').textContent=d.name;
    document.getElementById('p-price').textContent=rub(d.sum);
    var ps=document.getElementById('p-stage');ps.textContent=d.stage;ps.style.background=d.color;
    document.getElementById('p-src').textContent=d.srcN;
    document.getElementById('p-resp').textContent=RESP[d.ava]||'—';
    document.getElementById('p-phone').textContent=d.phone;
    document.getElementById('p-days').textContent=d.days;
    document.getElementById('p-budget').textContent=rub(d.sum);
    document.getElementById('p-feed').innerHTML=d._new
      ? '<div class="ev"><span class="t">сейчас</span><div class="d">сделка создана вручную</div></div>'
      : feed(d);
    document.getElementById('panel').classList.add('on');
    document.getElementById('ov').classList.add('on');
  };
  function closeDeal(){document.getElementById('panel').classList.remove('on');document.getElementById('ov').classList.remove('on');}
  document.getElementById('p-close').onclick=closeDeal;
  document.getElementById('ov').onclick=closeDeal;
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDeal();});

  // ── КАНБАН ──
  document.getElementById('pipe').innerHTML=STAGES.map(function(st,si){
    var ds=DEALS.filter(function(d){return d.si===si;});
    var total=ds.reduce(function(a,d){return a+d.sum;},0);
    var cards=ds.map(function(d){
      var gi=DEALS.indexOf(d);
      return '<div class="deal" data-k="'+gi+'" data-name="'+d.name+'"><div class="co">'+d.name+'</div>'+
        '<div class="price num">'+rub(d.sum)+'</div>'+
        '<div class="row"><span class="src '+d.src+'">'+d.srcN+'</span>'+
        '<span class="ava" style="background:'+d.avaC+'">'+d.ava+'</span></div>'+
        '<div class="days">в этапе '+d.days+'</div></div>';
    }).join('');
    return '<div class="col"><div class="head" style="background:'+st[1]+'">'+
      '<div class="st"><span>'+st[0]+'</span><span>'+ds.length+'</span></div>'+
      '<div class="sum num">'+rub(total)+'</div></div>'+
      '<div class="body">'+cards+'</div></div>';
  }).join('');

  // ── СПИСОК ──
  document.getElementById('list').innerHTML='<table class="ltable"><thead><tr>'+
    '<th>Компания</th><th>Этап</th><th class="r">Сумма</th><th>Источник</th><th>Ответственный</th><th>В этапе</th>'+
    '</tr></thead><tbody>'+DEALS.map(function(d){var gi=DEALS.indexOf(d);
      return '<tr data-k="'+gi+'" data-name="'+d.name+'">'+
        '<td class="co">'+d.name+'</td>'+
        '<td><span class="stg" style="--_c:'+d.color+'">'+d.stage+'</span></td>'+
        '<td class="r num">'+rub(d.sum)+'</td>'+
        '<td>'+d.srcN+'</td>'+
        '<td><span class="lava" style="background:'+d.avaC+'">'+d.ava+'</span>'+(RESP[d.ava]||'')+'</td>'+
        '<td>'+d.days+'</td></tr>';
    }).join('')+'</tbody></table>';

  // ── АНАЛИТИКА ──
  function kpi(v,k){return '<div class="kpi"><div class="kv num">'+v+'</div><div class="kk">'+k+'</div></div>';}
  function bar(lab,v,max,c){var w=max?Math.round(v/max*100):0;
    return '<div class="abar"><span class="lab">'+lab+'</span><span class="track"><span class="fill" style="width:'+w+'%;background:'+c+'"></span></span><span class="val num">'+rub(v)+'</span></div>';}
  (function(){
    var total=DEALS.reduce(function(a,d){return a+d.sum;},0), cnt=DEALS.length;
    var won=DEALS.filter(function(d){return d.stage==='Успешно реализовано';}).reduce(function(a,d){return a+d.sum;},0);
    var kp='<div class="kpis">'+kpi(cnt,'сделок в воронке')+kpi(rub(total),'сумма в воронке')+
      kpi(rub(Math.round(total/cnt)),'средний чек')+kpi(rub(won),'выиграно')+'</div>';
    var stg=STAGES.map(function(st,si){return {name:st[0],c:st[1],v:DEALS.filter(function(d){return d.si===si;}).reduce(function(a,d){return a+d.sum;},0)};});
    var mx=Math.max.apply(null,stg.map(function(s){return s.v;}));
    var b1=stg.map(function(s){return bar(s.name,s.v,mx,s.c);}).join('');
    var sm={};DEALS.forEach(function(d){sm[d.src]=(sm[d.src]||0)+d.sum;});
    var sa=Object.keys(sm).map(function(k){return {name:SRCLABEL[k],v:sm[k],c:SRCC[k]};}).sort(function(a,b){return b.v-a.v;});
    var mx2=Math.max.apply(null,sa.map(function(s){return s.v;}));
    var b2=sa.map(function(s){return bar(s.name,s.v,mx2,s.c);}).join('');
    document.getElementById('ana').innerHTML=kp+'<div class="two">'+
      '<div class="acard"><h3>Сумма по этапам</h3>'+b1+'</div>'+
      '<div class="acard"><h3>Сумма по источникам</h3>'+b2+'</div></div>';
  })();

  // ── переключение видов ──
  var VIEWS={'Канбан':'pipe','Список':'list','Аналитика':'ana'};
  var tabs=[].slice.call(document.querySelectorAll('.tabs span'));
  function showView(name){
    tabs.forEach(function(t){t.classList.toggle('on',t.textContent===name);});
    Object.keys(VIEWS).forEach(function(k){document.getElementById(VIEWS[k]).hidden=(k!==name);});
  }
  tabs.forEach(function(t){t.onclick=function(){showView(t.textContent);};});

  // клики по сделкам (канбан + список)
  document.body.addEventListener('click',function(e){
    var el=e.target.closest('[data-k]');if(!el)return;
    openDeal(DEALS[+el.getAttribute('data-k')]);
  });

  // поиск фильтрует и карточки, и строки
  document.querySelector('.search').addEventListener('input',function(e){
    var q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('.deal,.ltable tbody tr').forEach(function(el){
      var nm=(el.getAttribute('data-name')||'').toLowerCase();
      el.style.display=(!q||nm.indexOf(q)>-1)?'':'none';
    });
  });

  // рейл: Сделки → канбан, Аналитика → аналитика
  var links=[].slice.call(document.querySelectorAll('.rail a'));
  links.forEach(function(a){a.onclick=function(){
    links.forEach(function(x){x.classList.remove('on');});a.classList.add('on');
    if(a.title==='Аналитика')showView('Аналитика');
    else if(a.title==='Сделки')showView('Канбан');
  };});

  // + Сделка → карточка новой сделки
  document.querySelector('.add').onclick=function(){
    openDeal({name:'Новая сделка',sum:0,srcN:'—',ava:'',avaC:'#9aa5b8',phone:'—',days:'только что',stage:'Первичный контакт',color:'#2f8de4',_new:true});
  };
  // кнопки панели → мягкий фидбек, без alert
  document.querySelectorAll('.pacts button').forEach(function(b){var t=b.textContent;
    b.onclick=function(){b.textContent='✓ '+t;setTimeout(function(){b.textContent=t;},1200);};
  });
</script>
</body>
</html>
