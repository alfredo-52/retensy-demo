<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CallFix — ИИ разбирает звонки</title>
<style>
  :root{
    --bg:#0b0f17; --panel:#111722; --panel2:#161f2c; --line:#212c3d;
    --txt:#e7edf5; --dim:#8394ab; --acc:#7c5cff; --acc2:#22d3ee; --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 "Segoe UI",system-ui,sans-serif}
  .mono{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
  .head{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
  .logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:9px}
  .logo i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:inline-block}
  .head .sub{color:var(--dim);font-size:13px;margin-left:2px}
  .head .demo{margin-left:auto;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:4px 12px}

  .app{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 59px)}
  @media(max-width:800px){.app{grid-template-columns:1fr}.list{display:none}}

  .list{border-right:1px solid var(--line);background:var(--panel);overflow:auto}
  .filters{display:flex;gap:7px;padding:14px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .filters span{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:4px 10px;cursor:pointer}
  .filters span.on{color:var(--txt);border-color:var(--acc);background:rgba(124,92,255,.12)}
  .call{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
  .call:hover{background:var(--panel2)}
  .call.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--acc)}
  .call .r1{display:flex;align-items:center;gap:8px}
  .call .who{font-weight:600;font-size:14px}
  .call .dur{margin-left:auto;color:var(--dim);font-size:12px}
  .call .tema{font-size:12.5px;color:var(--dim);margin-top:4px}
  .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
  .t-hot{background:rgba(251,113,133,.15);color:var(--bad)} .t-ok{background:rgba(52,211,153,.15);color:var(--ok)}
  .t-mid{background:rgba(251,191,36,.15);color:var(--warn)} .t-new{background:rgba(34,211,238,.15);color:var(--acc2)}

  .detail{padding:24px 28px;overflow:auto}
  .dh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .dh h2{margin:0;font-size:20px}
  .dh .dur{color:var(--dim);font-size:13px}
  .meta{color:var(--dim);font-size:13px;margin-bottom:22px}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
  @media(max-width:640px){.cards{grid-template-columns:1fr}}
  .mc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}
  .mc .l{color:var(--dim);font-size:12px;margin-bottom:7px}
  .mc .v{font-size:15px;font-weight:600}
  .mc .chips{display:flex;gap:6px;flex-wrap:wrap}

  .sect{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:24px 0 12px}
  .sum{background:linear-gradient(120deg,rgba(124,92,255,.1),rgba(34,211,238,.06));border:1px solid var(--line);border-radius:12px;padding:16px 18px;line-height:1.6}

  .msg{display:flex;gap:12px;margin-bottom:14px;max-width:80%}
  .msg.op{margin-left:auto;flex-direction:row-reverse}
  .av{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .av.cl{background:#22303f;color:var(--acc2)} .av.op{background:rgba(124,92,255,.2);color:var(--acc)}
  .bub{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:14px}
  .msg.op .bub{background:rgba(124,92,255,.09)}
  .bub .t{font-size:11px;color:var(--dim);margin-top:5px}
  mark{background:rgba(251,191,36,.22);color:var(--warn);padding:0 3px;border-radius:3px}
</style>
</head>
<body>
<div class="head">
  <div class="logo"><i></i>CallFix</div>
  <span class="sub">ИИ-разбор звонков отдела продаж</span>
  <span class="demo">демо · данные вымышлены</span>
</div>

<div class="app">
  <div class="list" id="list">
    <div class="filters">
      <span class="on">Все</span><span>Горячие</span><span>Возражения</span><span>Недозвон</span>
    </div>
  </div>
  <div class="detail" id="detail"></div>
</div>

<script>
  var CALLS=[
    {id:0,who:'Смирнов А.',dur:'6:41',tema:'Цена и сроки монтажа',tag:'t-hot',tagT:'Горячий',mgr:'Ирина',
     tone:'заинтересован',theme:'Стоимость, сроки',action:'Отправить КП до 18:00, перезвонить завтра',
     dialog:[
      ['cl','Здравствуйте, сколько будет стоить монтаж под ключ и за какой срок сделаете?'],
      ['op','Добрый день! Зависит от объёма. По вашей площади ориентир 180-220 тысяч, срок 2-3 недели.'],
      ['cl','А можно быстрее? У нас <mark>горит до конца месяца</mark>.'],
      ['op','Если зайдём на этой неделе — успеем. Давайте я пришлю точную смету сегодня.'],
      ['cl','Давайте, жду. Если по цене сойдёмся — берём.']
     ]},
    {id:1,who:'ООО СтройБаза',dur:'3:12',tema:'Возражение по цене',tag:'t-mid',tagT:'Возражение',mgr:'Павел',
     tone:'сомневается',theme:'Дорого, сравнивает',action:'Прислать расчёт экономии, снять возражение цены',
     dialog:[
      ['cl','Вы дороже конкурентов процентов на двадцать. Почему?'],
      ['op','Мы даём гарантию 3 года и берём объект под ключ, без доплат по ходу.'],
      ['cl','У других тоже гарантия... <mark>надо подумать</mark>.'],
      ['op','Понимаю. Пришлю расчёт, где видно, на чём вы экономите за 3 года — тогда решите.']
     ]},
    {id:2,who:'Неизвестный',dur:'0:38',tema:'Бросил трубку',tag:'t-new',tagT:'Недозвон',mgr:'—',
     tone:'нейтральный',theme:'Не дозвонились до сути',action:'Перезвонить в удобное время, отправить в WhatsApp',
     dialog:[
      ['cl','Алло, это по объявлению...'],
      ['op','Да, здравствуйте! Чем помочь?'],
      ['cl','Ой, я за рулём, перезвоните попозже.']
     ]},
    {id:3,who:'Ковалёв И.',dur:'8:05',tema:'Тёплый, готов к сделке',tag:'t-ok',tagT:'Готов',mgr:'Ирина',
     tone:'позитивный',theme:'Финальные детали, оплата',action:'Выставить счёт, согласовать дату старта',
     dialog:[
      ['cl','Всё устраивает, давайте оформлять. Как оплата?'],
      ['op','Отлично! 50% предоплата по счёту, остаток по факту. Счёт пришлю в течение часа.'],
      ['cl','Хорошо, жду счёт. Когда сможете начать?'],
      ['op','На следующей неделе. Как оплата пройдёт — ставим в график.']
     ]}
  ];

  function renderList(){
    var host=document.getElementById('list');
    CALLS.forEach(function(c){
      var el=document.createElement('div'); el.className='call'+(c.id===0?' on':''); el.dataset.id=c.id;
      el.innerHTML='<div class="r1"><span class="who">'+c.who+'</span><span class="tag '+c.tag+'">'+c.tagT+'</span><span class="dur mono">'+c.dur+'</span></div>'+
        '<div class="tema">'+c.tema+'</div>';
      el.onclick=function(){ document.querySelectorAll('.call').forEach(function(x){x.classList.remove('on');}); el.classList.add('on'); renderDetail(c); };
      host.appendChild(el);
    });
  }
  function renderDetail(c){
    var d=document.getElementById('detail');
    var dialog=c.dialog.map(function(m){
      var who=m[0]==='op'?'op':'cl';
      var av=who==='op'?'<div class="av op">М</div>':'<div class="av cl">К</div>';
      return '<div class="msg '+who+'">'+av+'<div class="bub">'+m[1]+'</div></div>';
    }).join('');
    d.innerHTML=
      '<div class="dh"><h2>'+c.who+'</h2><span class="tag '+c.tag+'">'+c.tagT+'</span><span class="dur mono">'+c.dur+'</span></div>'+
      '<div class="meta">Менеджер: '+c.mgr+' · разобрано ИИ автоматически</div>'+
      '<div class="cards">'+
        '<div class="mc"><div class="l">Тема обращения</div><div class="v">'+c.theme+'</div></div>'+
        '<div class="mc"><div class="l">Тональность</div><div class="v">'+c.tone+'</div></div>'+
        '<div class="mc"><div class="l">Что делать</div><div class="v" style="font-size:13.5px;font-weight:500">'+c.action+'</div></div>'+
      '</div>'+
      '<div class="sect">Резюме звонка</div>'+
      '<div class="sum">'+c.dialog[0][1].replace(/<\/?mark>/g,'')+' Менеджер '+c.mgr+' отработал запрос; ИИ пометил ключевые сигналы и следующий шаг.</div>'+
      '<div class="sect">Расшифровка · ключевое подсвечено</div>'+
      dialog;
  }
  renderList(); renderDetail(CALLS[0]);
</script>
</body>
</html>
