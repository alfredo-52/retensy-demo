<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лоск — бот записи и расписание</title>
<style>
  :root{
    --bg:#f1ede5; --panel:#fffdf8; --line:#e7e0d3; --line2:#f2ece2; --txt:#2a251f; --dim:#8b8275;
    --rail:#1e2b25; --acc:#12805e; --acc2:#e7f2ec; --tg:#2aabee;
    --nail:#12805e; --hair:#2f6ff0; --color:#9333ea; --pedi:#0ea5a4; --brow:#d98a3a;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  a{color:inherit;text-decoration:none}
  .serif{font-family:Georgia,"Times New Roman",serif}
  .app{display:grid;grid-template-columns:216px 1fr;height:100vh}
  @media(max-width:820px){.app{grid-template-columns:56px 1fr}.side .lbl{display:none}}

  .side{background:var(--rail);color:#b7c4ba;display:flex;flex-direction:column;padding:16px 12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:22px;color:#fff;padding:6px 8px 20px;font-family:Georgia,serif}
  .brand i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#22c07f,#12805e);flex:none;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:700;color:#fff}
  .nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#b7c4ba;font-size:14px;cursor:pointer;margin-bottom:2px}
  .nav a .ic{width:18px;text-align:center;font-size:16px}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav a.on{background:linear-gradient(90deg,rgba(34,192,127,.28),rgba(34,192,127,.05));color:#fff;box-shadow:inset 2px 0 0 var(--acc)}
  .side .foot{margin-top:auto;font-size:12px;color:#8ea093;padding:12px 8px;border-top:1px solid rgba(255,255,255,.09)}
  .side .foot b{color:#5fd6a0}

  main{display:flex;flex-direction:column;overflow:hidden}
  .top{display:flex;align-items:center;gap:14px;padding:13px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
  .top h1{font-size:19px;margin:0;font-weight:700}
  .live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--acc);background:var(--acc2);padding:5px 11px;border-radius:20px;font-weight:600}
  .live .d{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:bl 1.6s infinite}
  @keyframes bl{50%{opacity:.35}}
  .datenav{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px}
  .datenav b{font-weight:600;min-width:150px;text-align:center}
  .datenav .a{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--dim)}
  .top .add{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:9px 15px;font-weight:600;font-size:13px;cursor:pointer}

  .body{flex:1;overflow:hidden}
  .sec{display:none;height:100%;overflow:auto;padding:18px 22px}
  .sec.on{display:block}
  #s-sched.on{display:flex;flex-direction:column;overflow:hidden;padding:16px 20px}

  .kstrip{display:flex;gap:22px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px;margin-bottom:12px;flex:none}
  .kstrip .s{font-size:13px;color:var(--dim)} .kstrip .s b{font-size:17px;color:var(--txt);margin-right:5px;font-weight:800}

  /* РАСПИСАНИЕ-СЕТКА */
  .schedcard{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;min-height:0}
  .sched{display:flex;min-width:760px}
  .timecol{flex:none;width:58px;border-right:1px solid var(--line)}
  .mcol{flex:1;min-width:170px;border-right:1px solid var(--line2)}
  .mcol:last-child{border-right:none}
  .mh{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 12px;position:sticky;top:0;background:var(--panel);z-index:3}
  .mav{width:34px;height:34px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
  .mh b{font-size:14px;display:block} .mh small{color:var(--dim);font-size:12px}
  .timecol .mh{justify-content:center}
  .tl{height:42px;border-bottom:1px solid var(--line2);font-size:11px;color:var(--dim);text-align:center;padding-top:3px}
  .track{position:relative}
  .slot{height:42px;border-bottom:1px solid var(--line2)}
  .slot:hover{background:#faf8f2}
  .book{position:absolute;left:5px;right:5px;border-radius:8px;padding:6px 9px;font-size:12px;cursor:pointer;overflow:hidden;border-left:3px solid;transition:.12s}
  .book:hover{filter:brightness(.97);box-shadow:0 6px 16px -8px rgba(60,45,20,.4)}
  .book b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .book .sv{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .book .tm{font-size:10.5px;opacity:.8}
  .book .src{position:absolute;top:6px;right:8px;font-size:11px}
  .bk-nail{background:#e8f4ee;border-color:var(--nail)} .bk-hair{background:#eaf0fc;border-color:var(--hair)}
  .bk-color{background:#f4ecfb;border-color:var(--color)} .bk-pedi{background:#e6f7f4;border-color:var(--pedi)}
  .bk-brow{background:#fbf0e4;border-color:var(--brow)}

  /* ДИАЛОГИ бота (чат) */
  .chatwrap{display:grid;grid-template-columns:320px 1fr;gap:14px;height:100%}
  @media(max-width:900px){.chatwrap{grid-template-columns:1fr}.chatview{display:none}}
  .chatlist{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto}
  .dlg{display:flex;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
  .dlg:hover{background:#faf8f2} .dlg.on{background:var(--acc2);box-shadow:inset 3px 0 0 var(--acc)}
  .dlg .da{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .dlg .di{flex:1;min-width:0} .dlg .di .r1{display:flex;gap:8px}.dlg .di b{font-size:14px}.dlg .di .tm{margin-left:auto;color:var(--dim);font-size:11px}
  .dlg .di .last{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .st{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
  .st-ok{background:#e8f4ee;color:var(--acc)} .st-wait{background:#fbf0e4;color:var(--brow)}
  .chatview{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
  .cvh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
  .cvbody{flex:1;overflow:auto;padding:18px;background:linear-gradient(#efece4,#f4f1ea);display:flex;flex-direction:column;gap:9px}
  .m{max-width:74%;padding:9px 13px;border-radius:15px;font-size:13.5px;line-height:1.4}
  .m.bot{background:#fff;border-bottom-left-radius:5px;align-self:flex-start}
  .m.usr{background:#c6f0d9;border-bottom-right-radius:5px;align-self:flex-end}
  .m .t{font-size:10px;color:var(--dim);margin-top:4px;text-align:right}
  .cvinfo{padding:12px 18px;border-top:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--dim);display:flex;gap:8px;align-items:center}
  .cvinfo b{color:var(--txt)}

  /* таблицы/карточки прочих разделов */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{text-align:left;color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:11px 18px;border-bottom:1px solid var(--line);background:#faf7f0}
  thead th.r,tbody td.r{text-align:right}
  tbody td{padding:12px 18px;border-bottom:1px solid var(--line2)} tbody tr:last-child td{border:none}
  tbody tr.clk{cursor:pointer} tbody tr.clk:hover{background:#faf8f2}
  .srcpill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px}
  .sp-bot{background:#e8f4ee;color:var(--acc)} .sp-phone{background:#eaf0fc;color:var(--hair)} .sp-walk{background:#fbf0e4;color:var(--brow)}
  .set{max-width:680px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
  .box h3{margin:0 0 3px;font-size:15px} .box .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px}
  .srow{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line2)}
  .srow:last-child{border:none} .srow .sd{flex:1} .srow .sd b{display:block} .srow .sd span{color:var(--dim);font-size:12.5px}
  .sw{width:42px;height:24px;border-radius:20px;background:#d5cfc2;position:relative;cursor:pointer;flex:none;transition:.15s}
  .sw.on{background:var(--acc)} .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s} .sw.on::after{left:20px}
  .selbox{border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff}
  .greet{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:13.5px;font-family:inherit;resize:vertical;background:#fff}

  /* панель записи */
  .ov{position:fixed;inset:0;background:rgba(40,35,25,.32);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .ov.on{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;right:0;height:100%;width:420px;max-width:94vw;background:var(--panel);z-index:50;transform:translateX(100%);
    transition:transform .24s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;box-shadow:-16px 0 44px -20px rgba(40,35,25,.4)}
  .panel.on{transform:none}
  .ph{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
  .ph h2{margin:0;font-size:19px} .ph .sub{color:var(--dim);font-size:13px;margin-top:3px}
  .ph .x{margin-left:auto;border:none;background:none;font-size:22px;color:var(--dim);cursor:pointer;line-height:1}
  .pbody{flex:1;overflow:auto;padding:18px 22px}
  .field{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line2);font-size:14px}
  .field .k{color:var(--dim)} .field .v{font-weight:600}
  .pact{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .pact button{flex:1;min-width:120px;border:none;border-radius:9px;padding:11px;font-weight:600;cursor:pointer;font-size:13.5px}
  .pact .go{background:var(--acc);color:#fff} .pact .sec2{background:#efeadf;color:var(--txt)} .pact .del{background:#fdecec;color:#c02b30}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i>Л</i><span class="lbl">Лоск</span></div>
    <div class="nav" id="nav">
      <a class="on" data-s="sched"><span class="ic">🗓️</span><span class="lbl">Расписание</span></a>
      <a data-s="chats"><span class="ic">💬</span><span class="lbl">Диалоги бота</span></a>
      <a data-s="records"><span class="ic">📋</span><span class="lbl">Записи</span></a>
      <a data-s="services"><span class="ic">✂️</span><span class="lbl">Услуги</span></a>
      <a data-s="settings"><span class="ic">⚙️</span><span class="lbl">Настройки бота</span></a>
    </div>
    <div class="foot"><span class="lbl">Бот записи<br><b>● онлайн</b>, отвечает сразу</span></div>
  </aside>

  <main>
    <div class="top">
      <h1 id="ptitle">Расписание</h1>
      <span class="live"><span class="d"></span> запись через бота идёт</span>
      <div class="datenav" id="datenav"><button class="a">‹</button><b>Сегодня, 4 сентября</b><button class="a">›</button></div>
      <button class="add" id="addbtn">+ Запись</button>
    </div>
    <div class="body">
      <section class="sec on" id="s-sched">
        <div class="kstrip" id="kstrip"></div>
        <div class="schedcard"><div class="sched" id="sched"></div></div>
      </section>

      <section class="sec" id="s-chats">
        <div class="chatwrap">
          <div class="chatlist" id="chatlist"></div>
          <div class="chatview" id="chatview"></div>
        </div>
      </section>

      <section class="sec" id="s-records">
        <div class="card"><table><thead><tr><th>Клиент</th><th>Услуга</th><th>Мастер</th><th>Время</th><th>Источник</th><th class="r">Сумма</th></tr></thead><tbody id="rrows"></tbody></table></div>
      </section>

      <section class="sec" id="s-services">
        <div class="card"><table><thead><tr><th>Услуга</th><th>Длительность</th><th class="r">Цена</th><th>Мастера</th></tr></thead><tbody id="svrows"></tbody></table></div>
      </section>

      <section class="sec" id="s-settings"><div class="set" id="settings"></div></section>
    </div>
  </main>
</div>

<div class="ov" id="ov"></div>
<aside class="panel" id="panel">
  <div class="ph"><div><h2 id="d-cli">—</h2><div class="sub" id="d-sv">—</div></div><button class="x" id="d-close">×</button></div>
  <div class="pbody" id="d-body"></div>
</aside>

<script>
  var MASTERS=[['Анна','ногтевой мастер','#12805e'],['Мария','парикмахер-стилист','#2f6ff0'],['Ольга','мастер педикюра','#0ea5a4'],['Ирина','бровист-лешмейкер','#d98a3a']];
  var SVCLASS={'Маникюр':'nail','Наращивание ногтей':'nail','Стрижка':'hair','Окрашивание':'color','Педикюр':'pedi','Брови':'brow','Ресницы':'brow','Ламинирование ресниц':'brow'};
  var PRICE={'Маникюр':2200,'Наращивание ногтей':3800,'Стрижка':2500,'Окрашивание':5900,'Педикюр':2800,'Брови':1100,'Ресницы':3200,'Ламинирование ресниц':2400};
  var SRC={bot:['из бота','sp-bot','🤖'],phone:['по телефону','sp-phone','📞'],walk:['пришёл сам','sp-walk','🚶']};
  var DAY0=600, DAY1=1200, ROW=42; // 10:00..20:00, 30 мин = ROW px
  function toMin(s){var p=s.split(':');return (+p[0])*60+(+p[1]);}
  function toHM(m){var h=Math.floor(m/60),mm=m%60;return h+':'+(mm<10?'0':'')+mm;}
  // [мастер, старт, длит(мин), клиент, услуга, источник]
  var BOOK=[
    [0,'10:00',60,'Полина','Маникюр','bot'],[0,'11:30',90,'Света','Наращивание ногтей','phone'],[0,'14:00',60,'Даша','Маникюр','bot'],[0,'16:30',60,'Оля','Маникюр','walk'],
    [1,'10:30',120,'Ника','Окрашивание','bot'],[1,'13:00',60,'Марина','Стрижка','phone'],[1,'15:00',90,'Дина','Окрашивание','bot'],[1,'17:30',60,'Катя','Стрижка','bot'],
    [2,'11:00',90,'Вера','Педикюр','phone'],[2,'13:30',60,'Юля','Маникюр','bot'],[2,'16:30',90,'Настя','Педикюр','bot'],
    [3,'10:00',45,'Алина','Брови','bot'],[3,'12:00',90,'Рита','Ресницы','phone'],[3,'15:30',45,'Лена','Брови','bot'],[3,'17:00',60,'Аня','Ламинирование ресниц','bot']
  ];

  // ── KPI ──
  (function(){
    var slots=MASTERS.length*((DAY1-DAY0)/30);
    var busy=BOOK.reduce(function(a,b){return a+b[2]/30;},0);
    var bot=BOOK.filter(function(b){return b[5]==='bot';}).length;
    document.getElementById('kstrip').innerHTML=
      '<span class="s"><b class="num">'+BOOK.length+'</b>записей сегодня</span>'+
      '<span class="s"><b class="num">'+Math.round(busy/slots*100)+'%</b>заполненность</span>'+
      '<span class="s"><b class="num">'+bot+'</b>через бота</span>'+
      '<span class="s"><b class="num">'+Math.round(slots-busy)+'</b>свободных окон</span>';
  })();

  // ── СЕТКА РАСПИСАНИЯ ──
  function timeCol(){
    var s='<div class="mh"></div>';
    for(var m=DAY0;m<DAY1;m+=30)s+='<div class="tl">'+toHM(m)+'</div>';
    return '<div class="timecol">'+s+'</div>';
  }
  function bookBlock(b,gi){
    var st=toMin(b[1]), top=(st-DAY0)/30*ROW, h=b[2]/30*ROW-4, cls=SVCLASS[b[4]]||'nail', sr=SRC[b[5]];
    return '<div class="book bk-'+cls+'" data-i="'+gi+'" style="top:'+(top+2)+'px;height:'+h+'px">'+
      '<span class="src">'+sr[2]+'</span>'+
      '<b>'+b[3]+'</b><span class="sv">'+b[4]+'</span><span class="tm">'+b[1]+'–'+toHM(st+b[2])+'</span></div>';
  }
  function masterCol(mi){
    var slots='';for(var m=DAY0;m<DAY1;m+=30)slots+='<div class="slot"></div>';
    var blocks=BOOK.map(function(b,gi){return {b:b,gi:gi};}).filter(function(x){return x.b[0]===mi;}).map(function(x){return bookBlock(x.b,x.gi);}).join('');
    var mm=MASTERS[mi];
    return '<div class="mcol"><div class="mh"><span class="mav" style="background:'+mm[2]+'">'+mm[0].charAt(0)+'</span><div><b>'+mm[0]+'</b><small>'+mm[1]+'</small></div></div>'+
      '<div class="track">'+slots+blocks+'</div></div>';
  }
  document.getElementById('sched').innerHTML=timeCol()+MASTERS.map(function(m,i){return masterCol(i);}).join('');
  document.getElementById('sched').addEventListener('click',function(e){var el=e.target.closest('.book');if(el)openBooking(+el.getAttribute('data-i'));});

  // ── панель записи ──
  function openBooking(i){
    var b=BOOK[i], st=toMin(b[1]), sr=SRC[b[5]];
    document.getElementById('d-cli').textContent=b[3];
    document.getElementById('d-sv').textContent=b[4]+' · '+b[1]+'–'+toHM(st+b[2]);
    document.getElementById('d-body').innerHTML=
      '<div class="field"><span class="k">Услуга</span><span class="v">'+b[4]+'</span></div>'+
      '<div class="field"><span class="k">Мастер</span><span class="v">'+MASTERS[b[0]][0]+' · '+MASTERS[b[0]][1]+'</span></div>'+
      '<div class="field"><span class="k">Время</span><span class="v">'+b[1]+' – '+toHM(st+b[2])+' ('+b[2]+' мин)</span></div>'+
      '<div class="field"><span class="k">Источник</span><span class="v"><span class="srcpill '+sr[1]+'">'+sr[2]+' '+sr[0]+'</span></span></div>'+
      '<div class="field"><span class="k">Статус</span><span class="v">'+(b[5]==='bot'?'подтверждена ботом':'подтверждена')+'</span></div>'+
      '<div class="field"><span class="k">Стоимость</span><span class="v num">'+(PRICE[b[4]]||0).toLocaleString('ru')+' ₽</span></div>'+
      '<div class="pact"><button class="go" id="d-rem">Напомнить клиенту</button><button class="sec2" id="d-mv">Перенести</button><button class="del" id="d-can">Отменить</button></div>';
    document.getElementById('d-rem').onclick=function(){this.textContent='✓ Напоминание в Telegram отправлено';this.disabled=true;};
    document.getElementById('d-mv').onclick=function(){this.textContent='Бот предложит клиенту другое окно';};
    document.getElementById('d-can').onclick=function(){this.textContent='Запись отменена';this.disabled=true;};
    document.getElementById('panel').classList.add('on');document.getElementById('ov').classList.add('on');
  }
  function closeBooking(){document.getElementById('panel').classList.remove('on');document.getElementById('ov').classList.remove('on');}
  document.getElementById('d-close').onclick=closeBooking;
  document.getElementById('ov').onclick=closeBooking;
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeBooking();});
  document.getElementById('addbtn').onclick=function(){var t=this.textContent,b=this;this.textContent='Выберите окно в сетке';setTimeout(function(){b.textContent=t;},1500);};

  // ── ДИАЛОГИ бота ──
  var DIALOGS=[
    {cli:'Полина',color:'#12805e',time:'2 мин',status:'ok',statusT:'записана',svc:'Маникюр, сегодня 18:00',
     msgs:[['bot','Здравствуйте! Я бот записи «Лоск» 💚 На какую услугу хотите записаться?'],['usr','Маникюр'],['bot','Отлично. Ближайшие окна к мастеру Анне:'],['usr','Сегодня 18:00'],['bot','Записала на маникюр сегодня в 18:00 ✨ Как вас зовут?'],['usr','Полина'],['bot','Готово, Полина! Ждём вас. Напомню за день до визита.']]},
    {cli:'Ника',color:'#2f6ff0',time:'14 мин',status:'ok',statusT:'записана',svc:'Окрашивание, завтра 12:30',
     msgs:[['usr','Здравствуйте, хочу окрашивание'],['bot','Здравствуйте! К стилисту Марии есть окна завтра. Подобрать удобное время?'],['usr','Да, на завтра'],['bot','Завтра свободно 12:30 и 15:00. Окрашивание займёт около 2 часов.'],['usr','12:30'],['bot','Записала на окрашивание завтра в 12:30 💫 Ваше имя?'],['usr','Ника'],['bot','Спасибо, Ника! До встречи.']]},
    {cli:'Алина',color:'#d98a3a',time:'40 мин',status:'ok',statusT:'записана',svc:'Брови, суббота 15:00',
     msgs:[['usr','можно брови в субботу'],['bot','Конечно! У бровиста Ирины в субботу свободно 13:00, 15:00, 17:30.'],['usr','15:00'],['bot','Записала на оформление бровей в субботу в 15:00 🤎 Как к вам обращаться?'],['usr','Алина'],['bot','Готово, Алина! Пришлю напоминание.']]},
    {cli:'Марина',color:'#9333ea',time:'1 ч',status:'wait',statusT:'ждёт ответа',svc:'Стрижка — выбирает время',
     msgs:[['usr','Здравствуйте! Сколько стоит женская стрижка?'],['bot','Здравствуйте! Женская стрижка у Марии — 2500 ₽, около часа. Записать вас?'],['usr','а когда есть места?'],['bot','Сегодня 16:00 или завтра 11:00. Что удобнее?']]}
  ];
  var CURD=0;
  function renderChatList(){
    document.getElementById('chatlist').innerHTML=DIALOGS.map(function(d,i){var last=d.msgs[d.msgs.length-1];
      return '<div class="dlg'+(i===CURD?' on':'')+'" data-i="'+i+'"><span class="da" style="background:'+d.color+'">'+d.cli.charAt(0)+'</span>'+
        '<div class="di"><div class="r1"><b>'+d.cli+'</b><span class="tm">'+d.time+'</span></div>'+
        '<div class="last">'+(last[0]==='bot'?'Бот: ':'')+last[1].replace(/<[^>]+>/g,'')+'</div></div></div>';}).join('');
  }
  function renderChat(i){
    var d=DIALOGS[i];
    document.getElementById('chatview').innerHTML=
      '<div class="cvh"><span class="da" style="background:'+d.color+'">'+d.cli.charAt(0)+'</span><div><b>'+d.cli+'</b><div style="font-size:12px;color:var(--dim)">Telegram · бот записи</div></div><span class="st st-'+d.status+'" style="margin-left:auto">'+d.statusT+'</span></div>'+
      '<div class="cvbody">'+d.msgs.map(function(m){return '<div class="m '+m[0]+'">'+m[1]+'</div>';}).join('')+'</div>'+
      '<div class="cvinfo">📌 <b>'+d.svc+'</b> · запись создана автоматически из диалога</div>';
  }
  renderChatList(); renderChat(0);
  document.getElementById('chatlist').addEventListener('click',function(e){var el=e.target.closest('.dlg');if(!el)return;CURD=+el.getAttribute('data-i');renderChatList();renderChat(CURD);});

  // ── ЗАПИСИ ──
  document.getElementById('rrows').innerHTML=BOOK.slice().sort(function(a,b){return toMin(a[1])-toMin(b[1]);}).map(function(b){var st=toMin(b[1]),sr=SRC[b[5]];
    return '<tr class="clk" data-i="'+BOOK.indexOf(b)+'"><td><b>'+b[3]+'</b></td><td>'+b[4]+'</td><td>'+MASTERS[b[0]][0]+'</td>'+
      '<td class="num">'+b[1]+'–'+toHM(st+b[2])+'</td><td><span class="srcpill '+sr[1]+'">'+sr[2]+' '+sr[0]+'</span></td>'+
      '<td class="r num">'+(PRICE[b[4]]||0).toLocaleString('ru')+' ₽</td></tr>';}).join('');
  document.getElementById('rrows').addEventListener('click',function(e){var tr=e.target.closest('.clk');if(tr)openBooking(+tr.getAttribute('data-i'));});

  // ── УСЛУГИ ──
  var SVC=[['Маникюр','60 мин',2200,'Анна, Ольга'],['Наращивание ногтей','90 мин',3800,'Анна'],['Педикюр','90 мин',2800,'Ольга'],['Женская стрижка','60 мин',2500,'Мария'],['Окрашивание','120 мин',5900,'Мария'],['Оформление бровей','45 мин',1100,'Ирина'],['Наращивание ресниц','120 мин',3200,'Ирина'],['Ламинирование ресниц','60 мин',2400,'Ирина']];
  document.getElementById('svrows').innerHTML=SVC.map(function(s){return '<tr><td><b>'+s[0]+'</b></td><td class="num">'+s[1]+'</td><td class="r num">'+s[2].toLocaleString('ru')+' ₽</td><td class="muted" style="color:var(--dim)">'+s[3]+'</td></tr>';}).join('');

  // ── НАСТРОЙКИ бота ──
  document.getElementById('settings').innerHTML=
    '<div class="box"><h3>Приветствие бота</h3><div class="sub">первое сообщение клиенту в Telegram</div>'+
      '<textarea class="greet" rows="2">Здравствуйте! Я бот записи «Лоск» 💚 На какую услугу хотите записаться?</textarea></div>'+
    '<div class="box"><h3>Часы записи</h3><div class="sub">окна, которые бот предлагает клиентам</div>'+
      '<div class="srow"><span class="sd"><b>Рабочие часы</b><span>бот предлагает окна только в это время</span></span><select class="selbox"><option>10:00 – 20:00</option><option>09:00 – 21:00</option></select></div>'+
      '<div class="srow"><span class="sd"><b>Шаг записи</b><span>минимальный интервал между окнами</span></span><select class="selbox"><option>30 минут</option><option>15 минут</option><option>60 минут</option></select></div></div>'+
    '<div class="box"><h3>Автоматика</h3><div class="sub">что бот делает без администратора</div>'+
      settingRow('Напоминание за день','пуш клиенту за 24 часа до визита',true)+
      settingRow('Напоминание за 2 часа','короткое напоминание в день визита',true)+
      settingRow('Добор пустых окон','предлагать отменённые окна из листа ожидания',true)+
      settingRow('Запрос отзыва после визита','через 2 часа после услуги',false)+
      settingRow('Выгрузка записей в CRM','каждая запись падает в amoCRM',true)+'</div>';
  function settingRow(t,s,on){return '<div class="srow"><span class="sd"><b>'+t+'</b><span>'+s+'</span></span><span class="sw'+(on?' on':'')+'"></span></div>';}
  document.getElementById('settings').addEventListener('click',function(e){var w=e.target.closest('.sw');if(w)w.classList.toggle('on');});

  // ── навигация ──
  var TITLES={sched:'Расписание',chats:'Диалоги бота',records:'Записи',services:'Услуги и цены',settings:'Настройки бота'};
  function showSec(s){
    document.querySelectorAll('#nav a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-s')===s);});
    ['sched','chats','records','services','settings'].forEach(function(k){document.getElementById('s-'+k).classList.toggle('on',k===s);});
    document.getElementById('ptitle').textContent=TITLES[s];
    document.getElementById('datenav').hidden=(s!=='sched');
    document.getElementById('addbtn').hidden=(s!=='sched');
  }
  document.getElementById('nav').addEventListener('click',function(e){var a=e.target.closest('[data-s]');if(a)showSec(a.getAttribute('data-s'));});
</script>
</body>
